[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-qaqc-rules"
version = "0.1.0"
description = "Quality assurance and quality control rules for traffic signal inventories."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "pyproj",
    "shapely",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
